name: Kartinnsyn – publiser til Cloudflare

# Bygger kartinnsynet og Kartlab og publiserer dist/ som statiske filer i Cloudflare Workers
# (se kartinnsyn/wrangler.jsonc). Krever repo-hemmelighetene CLOUDFLARE_API_TOKEN og
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths: ["kartinnsyn/**", ".github/workflows/kartinnsyn-cloudflare.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kartinnsyn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kartinnsyn/package-lock.json
      - run: npm ci
      - run: npm run build

      # Kartlab: datagrunnlaget lages fra Overture (S3) og bygges for alle byer.
      # Uttrekkene caches per innstilling i areas.json, så de hentes bare på nytt ved endring.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb
      - uses: actions/cache@v4
        with:
          path: |
            kartinnsyn/ai-demo/data*/
            /tmp/overture-cache
          key: kartlab-data-${{ hashFiles('kartinnsyn/ai-demo/areas.json', 'kartinnsyn/ai-demo/scripts/*') }}
      - name: Lag Kartlab-data (hopper over byer som finnes i cachen)
        run: |
          for k in $(node -e "console.log(Object.keys(require('./ai-demo/areas.json')).filter(k=>!k.startsWith('_')).join(' '))"); do
            dir=$(node -e "console.log(require('./ai-demo/areas.json')['$k'].data)")
            if [ -f "ai-demo/$dir/transportation.pmtiles" ] && [ -f "ai-demo/$dir/places.json" ]; then
              echo "$k: bruker cachet data"
            else
              npm run kartlab:data -- "$k"
            fi
          done
      - run: npm run kartlab:build
      - run: cp -r ai-demo/dist dist/kartlab

      # Workers Static Assets: maks 25 MiB per fil og 20 000 filer per versjon (gratisplan).
      # Kartlab-dataene ligger som base64-tekst og kan vokse, så sjekk før opplasting.
      - name: Kontroller filstørrelser mot Cloudflare-grensene
        run: |
          echo "Største filer:"
          find dist -type f -printf '%s\t%p\n' | sort -rn | head -5 | numfmt --to=iec-i --field=1
          antall=$(find dist -type f | wc -l)
          echo "Antall filer: $antall"
          for_store=$(find dist -type f -size +25M)
          if [ -n "$for_store" ]; then
            echo "::error::Disse filene er større enn 25 MiB og kan ikke publiseres som statiske filer i Workers. Flytt dem til R2:"
            echo "$for_store"
            exit 1
          fi
          if [ "$antall" -gt 20000 ]; then
            echo "::error::Bygget har $antall filer, over grensen på 20 000 per versjon."
            exit 1
          fi

      - name: Publiser til Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: kartinnsyn
          command: deploy
